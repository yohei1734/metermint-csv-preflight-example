openapi: 3.0.3
info:
  title: MeterMint CSV Preflight API
  version: 0.1.3
  description: >-
    Detect CSV dialect and structural failures before import, with optional
    deterministic normalization. Request bodies are not persisted by the
    application, but transit RapidAPI and Cloudflare; do not send secrets or
    regulated or sensitive personal data.
servers:
  - url: https://metermint-csv-preflight.p.rapidapi.com
security:
  - RapidApiKey: []
    RapidApiHost: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health and limits
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version, maxInputBytes]
                properties:
                  ok: { type: boolean, example: true }
                  service: { type: string, example: metermint-csv-preflight }
                  version: { type: string, example: 0.1.3 }
                  maxInputBytes: { type: integer, example: 262144 }
  /v1/preflight:
    post:
      operationId: preflightCsv
      summary: Detect CSV dialect and import-blocking structural issues
      description: >-
        Returns 200 for import-ready input, 422 for parsed input with structural
        findings, and 4xx for an invalid request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  maxLength: 262144
                  example: "email;name;name\na@example.com;Ana;A\nb@example.com;Ben"
                options:
                  type: object
                  additionalProperties: false
                  properties:
                    delimiter:
                      type: string
                      enum: [",", ";", "\t", "|"]
                    outputDelimiter:
                      type: string
                      enum: [",", ";", "\t", "|"]
                      default: ","
                    includeNormalized:
                      type: boolean
                      default: true
      responses:
        "200":
          description: CSV is structurally valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreflightResponse" }
        "400":
          description: Invalid JSON, missing CSV, or unsupported option
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: CSV exceeds 256 KiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: Content-Type is not application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: CSV was parsed and structural issues were found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreflightResponse" }
components:
  securitySchemes:
    RapidApiKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: Keep this value in a protected runtime secret store.
    RapidApiHost:
      type: apiKey
      in: header
      name: X-RapidAPI-Host
      description: Use metermint-csv-preflight.p.rapidapi.com.
  schemas:
    Issue:
      type: object
      required: [code, severity, message, row, column]
      properties:
        code: { type: string, example: ROW_WIDTH_MISMATCH }
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
        row: { type: integer, nullable: true, minimum: 1 }
        column: { type: integer, nullable: true, minimum: 1 }
    PreflightResponse:
      type: object
      required: [ok, report]
      properties:
        ok: { type: boolean }
        report:
          type: object
          required: [valid, bytes, newline, delimiter, rows, nonEmptyRows, expectedColumns, headers, errorCount, warningCount, issues]
          properties:
            valid: { type: boolean }
            bytes: { type: integer }
            bom: { type: string, nullable: true }
            newline: { type: string, enum: [CRLF, LF, CR, mixed, none] }
            delimiter: { type: string, example: ";" }
            delimiterConfidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
            rows: { type: integer }
            nonEmptyRows: { type: integer }
            expectedColumns: { type: integer }
            headers: { type: array, items: { type: string } }
            errorCount: { type: integer }
            warningCount: { type: integer }
            issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
            normalizedCsv: { type: string, nullable: true }
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: CSV_TOO_LARGE }
            message: { type: string }
            maxBytes: { type: integer }
            receivedBytes: { type: integer }
